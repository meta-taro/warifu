[package]
name = "warifu-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
warifu-core.workspace = true
warifu-intent.workspace = true
warifu-meeting = { path = "../warifu-meeting" }

[dev-dependencies]
# 統合試験だけで使う。**本体は経路を知らないまま**にしておく（baseline §9）
warifu-net.workspace = true
# **層をまたいだ通し試験だけで使う**（D118 —— 合言葉で証しを作り、戸口が受けるまで）。
# **本体は戸口を知らないまま**にしておく（baseline §9）
warifu-door = { path = "../warifu-door" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
