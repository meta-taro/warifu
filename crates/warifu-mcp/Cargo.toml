[package]
name = "warifu-mcp"
description = "受信箱を MCP の口として出す。**すべての呼び出しが関所を通る。**"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# 届いた発言の月日を、今日の分だけ落とすため（0.1.41）
chrono = { version = "0.4", default-features = false, features = ["clock"] }
warifu-read.workspace = true
warifu-capability.workspace = true
warifu-calendar.workspace = true
warifu-desk.workspace = true
rmcp.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-std", "net", "io-util", "sync", "rt", "macros"] }

[dev-dependencies]
warifu-desk.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
