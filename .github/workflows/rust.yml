name: rust

# 品質ゲート（product-baseline §5）。
# 手元に git hooks は無く、開発機によっては cargo すら入っていないことがある。
# §5 は「手元のゲートが実行不能なら CI を最終ゲートにして先へ進む」と定めているので、
# **その最終ゲートをここに置く**。落ちたまま放置しない・無効化して通したことにしない（§20）。

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - develop

permissions:
  contents: read

# 同じ枝への push が続いたとき、古い実行を残さない（結果が 2 つ出ると、どちらが今か分からなくなる）
concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # 依存だけで 300 crate 超（iroh）。デバッグ情報を落として cache を膨らませない
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  # **Windows でも試験を回す**（2026-09-13）。
  #
  # ここが無かったため、**Windows 固有の不具合は CI では永久に出なかった** ——
  # `gh issue 6`（**Windows に `HOME` は無い**ので、画面も CLI も起動できなかった）は
  # **別マシンの人が実物で踏んで初めて分かった。**
  # `rust.yml` / `desktop.yml` は ubuntu だけ、`release.yml` の windows 段は
  # **建てるだけ**で試験を回していない。
  #
  # **fmt と clippy は ubuntu 側だけで見る**（同じものを 2 回見ない）。
  # ここで見たいのは「**その OS で振る舞いが変わる所**」である。
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version

      - name: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-windows-${{ hashFiles('Cargo.lock') }}
          restore-keys: rust-windows-

      # **画面の crate は workspace の外**なので、ここでは回らない
      # （あちらは `release.yml` の windows 段で建てている）
      # **`--no-fail-fast` を付ける。**
      #
      # 付けていなかったので、**最初に落ちた束で止まっていた** ——
      # 2026-09-13 に足した初回、こちらには 2 件しか見えず「直った」と思った。
      # **実際は 7 件落ちていて**、Windows の人が手元で回して `gh issue 15` に上げた。
      # **落ちているものを全部見せる。**
      - name: cargo test
        run: cargo test --workspace --locked --no-fail-fast

  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # runner に入っている rust は更新されるので、必要な component だけを明示して入れ直す。
      # 第三者の action を足さないのは、依存を増やさないため（§12）。
      - name: toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc --version
          cargo --version

      - name: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      # fmt → clippy → test の順。形の崩れで clippy のログを読ませない
      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # warifu-net / warifu-meeting のテストは実際に経路を張る（iroh）。
      # ここが runner のネットワーク都合で落ちた場合、直すのは**テスト側**であって、
      # テストを消すことではない（§4「繋がらない環境でも走る形にする」）。
      - name: test
        run: cargo test --workspace
