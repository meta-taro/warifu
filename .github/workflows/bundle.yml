name: bundle

# **配布物が建つかを確かめる。**Windows / macOS の両方。
#
# 毎 push では走らせない（**D37**）。Tauri を建てると 10 分単位で伸び、
# 判定のコードを 1 行直すたびに GUI の依存が建て直される。**遅いゲートは飛ばされる。**
#
# 走らせるのは 2 つのときだけ。
#   - 人が手で起動したとき（workflow_dispatch）
#   - タグを打ったとき（配布の直前）
#
# **Windows でも画面が建つ**（2026-09-14 に実測。実行 34844034255 の成果物に
# `warifu-desktop.exe` 25MB が入っていることを確かめた）。
#
# 2026-09-03 から 09-06 までは建たなかった。記録として残す ——
#
#   tauri 2.11.5 が windows "^0.61" を要求するため、画面側の lock には
#   windows が 0.61.3 と 0.62.2 の 2 本入る。そこで wmi 0.18.4 が
#   **windows 0.61.3 ＋ windows-core 0.62.2 という食い違った組**を掴み、
#   `IWbemObjectSink: windows_core::Interface is not satisfied` で落ちていた。
#
# **この注記が古いままだと、「Windows に画面を届ける手段が無い」と読める。**
# 実際、それを前提に手順を書きかけた（2026-09-14）。**建つなら建つと書く。**

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: bundle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      # **片方が落ちても、もう片方の結果を見る。**
      # Windows だけ落ちたのか両方なのかで、原因の見当が変わる
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: node と pnpm
        run: |
          corepack enable
          corepack prepare --activate
          node --version
          pnpm --version

      - name: rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: install
        run: pnpm install --frozen-lockfile

      - name: CLI を建てる
        run: cargo build --release -p warifu-cli

      - name: フロントを建てる
        run: pnpm --filter @warifu/desktop build

      # --no-bundle: 実行ファイルまで。インストーラは署名が要るので、鍵が入ってから
      - name: 画面を建てる
        working-directory: apps/desktop/src-tauri
        run: cargo build --release

      # **建てただけで終わらせない。**
      #
      # 2026-09-07 に Windows のエージェントから来た指摘 ——
      # 「**`develop` の CI は成果物を出していません。Windows バイナリが出るのは
      # release（タグ）だけです。『Windows で試してほしい』のに、
      # `develop` を試す手段が Windows 側に無いという形になっています。**」
      #
      # **そのとおりだった。**Windows には Rust が入っていないので、
      # 手元で建てることもできない。**タグを待たせるのは、こちらの都合である。**
      - name: できたものを上げる
        uses: actions/upload-artifact@v4
        with:
          name: warifu-${{ matrix.os }}-develop
          path: |
            target/release/warifu
            target/release/warifu.exe
            apps/desktop/src-tauri/target/release/warifu-desktop
            apps/desktop/src-tauri/target/release/warifu-desktop.exe
          if-no-files-found: error
          retention-days: 7
