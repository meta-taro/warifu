name: oss-privacy-check

# OSS 公開リポの個人情報混入チェック（product-baseline §32）
# 実名・個人メールが commit history に入ると、後から消すには history 書き換えと
# force push が要る＝実質不可逆。push / PR の時点で機械的に止める。

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - develop

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # commit 範囲を検査するため全履歴が要る
          fetch-depth: 0

      - name: 個人情報混入チェック
        env:
          # 実名などの禁止語は、リポジトリに置くとそれ自体が公開になるため secrets から渡す。
          # 未設定なら禁止語検査はスキップされ、メール検査だけが走る。
          OSS_DENY_WORDS: ${{ secrets.OSS_DENY_WORDS }}
          OSS_ALLOWED_AUTHOR_EMAIL_REGEX: ${{ vars.OSS_ALLOWED_AUTHOR_EMAIL_REGEX }}
          OSS_ALLOWED_EMAIL_DOMAINS: ${{ vars.OSS_ALLOWED_EMAIL_DOMAINS }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: bash .github/scripts/oss-privacy-check.sh "$BASE_SHA" "$HEAD_SHA"

      # **workflow 自身を検める。**
      #
      # `actionlint` は入れていない。見るのは 1 つだけ ——
      # **まだ定義されていない `steps.<id>.outputs` を `if:` で読んでいないか。**
      # 読むと条件は空文字と比べられて false になり、**段が黙って飛ぶ**
      # （job は success のまま）。2026-09-12 の `v0.1.3` で、
      # CLI の署名がこの形で 2 版ぶん飛んでいた。
      - name: workflow の段の順番
        run: python3 scripts/check-step-order.py
