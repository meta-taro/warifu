# **root の cargo workspace には入れない。**
# 入れると `cargo test --workspace`（commit 前のゲートと CI）が毎回 Tauri を建てる。
# 判定のコードを直すたびに GUI の依存を建て直すのは、ゲートを遅くして飛ばされる原因になる。
[package]
name = "warifu-desktop"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/meta-taro/warifu"
publish = false

[lib]
name = "warifu_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

# 判定と進行は workspace 側のクレートが持つ。**ここには規則を書かない**（baseline §9）。
# この crate がやるのは「画面から呼べる形に直す」ことだけである。
warifu-core = { path = "../../../crates/warifu-core" }
warifu-net = { path = "../../../crates/warifu-net" }
warifu-intent = { path = "../../../crates/warifu-intent" }
warifu-meeting = { path = "../../../crates/warifu-meeting" }
warifu-app = { path = "../../../crates/warifu-app" }
warifu-door = { path = "../../../crates/warifu-door" }
warifu-vault = { path = "../../../crates/warifu-vault" }
warifu-desk = { path = "../../../crates/warifu-desk" }
warifu-postbox = { path = "../../../crates/warifu-postbox" }
serde = { version = "1", features = ["derive"] }
# `tauri::generate_context!` が、tauri.conf.json の plugins を読むのに要る
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
# 時刻を HH:MM で出すためだけに使う。**既に木にあるもの**を使い、供給元を増やさない
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tauri-plugin-notification = "2.4.0"
# **`warifu://` を受ける**（D79）。鍵を貼り付けさせない
tauri-plugin-deep-link = "2.4.10"
# **更新を確かめて入れ替える**（D81）。
# 署名された `latest.json` を取りに行き、埋め込んだ公開鍵で検めてから落とす。
# `process` は入れ替えたあとの立て直し（`relaunch`）に要る。
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# **QR を作る**（D79）。目の前の相手に読ませる用
fast_qr = { version = "0.14", default-features = false, features = ["svg"] }

[profile.release]
# 鍵を扱う側と同じ姿勢を保つ（root の Cargo.toml と揃える）
overflow-checks = true
