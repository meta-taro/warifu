[workspace]
resolver = "3"
members = [
    "crates/warifu-core",
    "crates/warifu-net",
    "crates/warifu-intent",
    "crates/warifu-meeting",
    "crates/warifu-read",
    "crates/warifu-imap",
    "crates/warifu-capability",
    "crates/warifu-mcp",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/meta-taro/warifu"

[workspace.dependencies]
ed25519-dalek = { version = "2.2", default-features = false, features = ["std", "zeroize"] }
hkdf = "0.12"
sha2 = "0.10"
getrandom = "0.3"
zeroize = { version = "1.8", features = ["derive"] }
warifu-core = { path = "crates/warifu-core" }
warifu-net = { path = "crates/warifu-net" }
warifu-intent = { path = "crates/warifu-intent" }
warifu-read = { path = "crates/warifu-read" }
warifu-capability = { path = "crates/warifu-capability" }
# MCP は動く仕様なので、自前で追わず公式 SDK に寄せる（D25）
rmcp = { version = "3", features = ["server", "macros", "schemars", "transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# MIME を解く。Adapter の内側だけで使い、warifu-read には入れない（D18）
mail-parser = { version = "0.11", default-features = false, features = ["full_encoding"] }
# IMAP。runtime-tokio を選ぶ（D10 で tokio に決めてある）
async-imap = { version = "0.11", default-features = false, features = ["runtime-tokio"] }
# TLS は **既に木にあるもの**を使う（iroh 経由で rustls / ring / webpki-roots が入っている）。
# 既定の aws-lc-rs は cmake で C を建てるので採らない。**新しいビルド系を増やさない**
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "1"
futures = "0.3"
iroh = "1.0"
tokio = { version = "1", features = ["rt", "macros", "time", "sync"] }

[profile.dev]
# 自分たちのコードのデバッグ情報は残す
debug = true

[profile.dev.package."*"]
# 依存（iroh だけで 300 crate 超）のデバッグ情報は落とす。
# 残すと target が数 GB 単位で膨らむ。**追うのは自分たちのコードなので、無くて困らない。**
debug = false

[profile.release]
# 鍵を扱うので、リリースでも overflow を黙って回さない
overflow-checks = true
