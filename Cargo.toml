[workspace]
resolver = "3"
members = ["crates/warifu-core"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/meta-taro/warifu"

[workspace.dependencies]
ed25519-dalek = { version = "2.2", default-features = false, features = ["std", "zeroize"] }
hkdf = "0.12"
sha2 = "0.10"
getrandom = "0.3"
zeroize = { version = "1.8", features = ["derive"] }

[profile.release]
# 鍵を扱うので、リリースでも overflow を黙って回さない
overflow-checks = true
